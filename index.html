<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Archive</title>
    <meta name="description" content="Your personal collection of archived content, organized in one place.">

    <link id="site-favicon" rel="icon" href="">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="My Archive">
    <meta property="og:title" content="My Archive">
    <meta property="og:description" content="Your personal collection of archived content, organized in one place.">
    <meta property="og:image" content="">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="My Archive">
    <meta name="twitter:description" content="Your personal collection of archived content, organized in one place.">
    <meta name="twitter:image" content="">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-shell" id="app-shell">

    <header class="header">

        <div class="header-left">
            <button class="logo" id="home-link" aria-label="Go to home">
                <span id="site-name">MY ARCHIVE</span>
            </button>
        </div>
        
        <nav class="header-navigation" id="header-navigation"></nav>

        <div class="header-actions">
            <button
                class="icon-button"
                id="more-toggle"
                aria-label="More options"
                aria-expanded="false"
                title="More options">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="5" cy="12" r="1.5"/>
                    <circle cx="12" cy="12" r="1.5"/>
                    <circle cx="19" cy="12" r="1.5"/>
                </svg>
            </button>

            <div class="more-menu" id="more-menu">
                <button id="theme-toggle">Dark mode</button>
                <button id="more-home">Home</button>
                <button id="more-sidebar">Toggle sidebar</button>
            </div>
        </div>

    </header>
    
<nav class="page-toolbar" id="page-toolbar" aria-label="Page navigation">

            <button
                class="icon-button sidebar-toggle"
                id="sidebar-toggle"
                aria-label="Toggle sidebar"
                aria-expanded="true"
                title="Toggle sidebar">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 6h18M3 12h18M3 18h18"/>
                </svg>
            </button>
    
    <div class="breadcrumb" id="breadcrumb">
        <button type="button" id="breadcrumb-home">Home</button>
        <span aria-hidden="true">/</span>
        <span id="breadcrumb-current"></span>
    </div>

    <div class="history-controls">
        <button type="button" id="history-back" title="Go back" disabled>
            ← Back
        </button>
        <button type="button" id="history-forward" title="Go forward" disabled>
            Forward →
        </button>

<button
    type="button"
    class="icon-button wiki-toggle"
    id="wiki-toggle"
    aria-label="Toggle Wiki Panel"
    aria-expanded="true"
    aria-controls="wiki-panel"
    title="Toggle Wiki Panel">
    <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 4h16v16H4z"/>
        <path d="M15 4v16"/>
    </svg>
</button>

    </div>
</nav>
    
    <div class="layout">

        <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

        <aside class="sidebar" id="sidebar">
            <nav id="navigation"></nav>
        </aside>

        <main class="content">
            <div id="page-content"></div>
        </main>

<div class="wiki-backdrop" id="wiki-backdrop"></div>

<aside
    class="wiki-panel"
    id="wiki-panel"
    aria-label="Archive Wiki"
    aria-hidden="false">

    <div class="wiki-panel-header">
        <strong>Archive Wiki</strong>
        <button
            type="button"
            id="wiki-close"
            class="icon-button"
            aria-label="Close Wiki Panel"
            title="Close">
            ×
        </button>
    </div>

    <div id="wiki-content" class="wiki-content">
        <p>Loading archive information...</p>
    </div>

</aside>
        
    </div>

    <footer class="footer">
        © <span id="copyright-year"></span>
        <span id="footer-site-name">My Archive</span>. All rights reserved.
    </footer>
    
</div>

<script src="app.js"></script>
<script src="scripts/wiki-panel.js"></script>
    
</body>
</html>
