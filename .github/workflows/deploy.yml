name: Build and deploy My Archive

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.ARCHIVE_STORAGE_REPO != ''
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website template
        uses: actions/checkout@v4

      - name: Checkout archive storage
        env:
          STORAGE_REPO: ${{ vars.ARCHIVE_STORAGE_REPO }}
        run: |
          git clone --depth 1 \
            "https://github.com/${STORAGE_REPO}.git" storage

      - name: Combine website and archive
        run: |
          rm -rf archive
          mkdir -p archive

          if [ ! -d storage/archive ]; then
            echo "Storage repository does not contain archive/."
            exit 1
          fi

          cp -a storage/archive/. archive/
          rm -rf storage

      - name: Generate archive index
        run: node scripts/generate-index.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
