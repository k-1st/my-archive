<style>
/* --------------------------------------------------
   Contact page
-------------------------------------------------- */

.contact-page {
    width: 100%;
    max-width: 100%;
    overflow-wrap: anywhere;
}

.contact-header {
    max-width: 760px;
    margin-bottom: 28px;
}

.contact-eyebrow {
    margin-bottom: 8px;
    color: var(--muted-color);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
}

.contact-header h1 {
    margin: 0 0 12px;
}

.contact-header > p:last-child {
    color: var(--muted-color);
    line-height: 1.7;
}

.contact-owner {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 30px;
    padding: 20px;
    border: 1px solid var(--soft-border);
    border-radius: 10px;
    background: var(--surface-bg);
}

.contact-owner-photo {
    width: 88px;
    height: 88px;
    flex-shrink: 0;
    border-radius: 50%;
    object-fit: cover;
}

.contact-owner-details h2 {
    margin: 0 0 6px;
    font-size: 21px;
}

.contact-section {
    margin-top: 30px;
}

.contact-section-title {
    margin: 0 0 15px;
    font-size: 19px;
}

.contact-grid {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(min(100%, 260px), 1fr)
    );
    gap: 14px;
}

.contact-card {
    min-width: 0;
    padding: 18px;
    border: 1px solid var(--soft-border);
    border-radius: 9px;
    background: var(--surface-bg);
}

.contact-card-title {
    margin: 0 0 10px;
    font-size: 16px;
}

.contact-link {
    color: var(--text-color);
    text-decoration: underline;
    text-decoration-color: var(--muted-color);
    text-underline-offset: 3px;
    overflow-wrap: anywhere;
}

.contact-link:hover {
    text-decoration-color: currentColor;
}

.contact-address-line {
    margin: 5px 0;
    color: var(--muted-color);
    line-height: 1.5;
}

.contact-map-link {
    display: inline-block;
    margin-top: 12px;
}

.contact-muted {
    color: var(--muted-color);
    line-height: 1.6;
}

.contact-hours-list {
    max-width: 650px;
    border-top: 1px solid var(--soft-border);
}

.contact-hours-row {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding: 12px 0;
    border-bottom: 1px solid var(--soft-border);
}

.contact-hours-row span {
    color: var(--muted-color);
}

.contact-hours-row strong {
    text-align: right;
}

.contact-public-note {
    margin-top: 30px;
    padding: 16px 18px;
    border-left: 3px solid var(--border-color);
    background: var(--hover-bg);
    line-height: 1.6;
}

.contact-empty {
    padding: 20px;
    border: 1px dashed var(--soft-border);
    border-radius: 8px;
    color: var(--muted-color);
    line-height: 1.6;
}

@media (max-width: 600px) {
    .contact-owner {
        align-items: flex-start;
        gap: 14px;
        padding: 15px;
    }

    .contact-owner-photo {
        width: 65px;
        height: 65px;
    }

    .contact-hours-row {
        flex-direction: column;
        gap: 5px;
    }

    .contact-hours-row strong {
        text-align: left;
    }
}
</style>

<section class="contact-page" id="contact-page">
    <header class="page-header">
        <p class="page-eyebrow">CONTACT</p>
        <h1 id="contact-heading">Get in Touch</h1>
        <p id="contact-intro">
            Contact information and ways to reach the archive owner.
        </p>
    </header>

    <div id="contact-content" aria-live="polite">
        <p class="contact-muted">Loading contact information...</p>
    </div>
</section>

<script>
(function () {
    const root = document.getElementById("contact-page");
    if (!root || root.dataset.initialized === "true") return;
    root.dataset.initialized = "true";

    const content = root.querySelector("#contact-content");
    const heading = root.querySelector("#contact-heading");
    const intro = root.querySelector("#contact-intro");

    function value(input) {
        return typeof input === "string" ? input.trim() : "";
    }

    function element(tag, className, contentText) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (contentText !== undefined) node.textContent = contentText;
        return node;
    }

    function safeUrl(input, allowed) {
        const raw = value(input);
        if (!raw) return "";

        try {
            const url = new URL(raw, window.location.href);
            if (!allowed.includes(url.protocol)) return "";
            return url.href;
        } catch {
            return "";
        }
    }

    function externalLink(label, url) {
        const href = safeUrl(url, ["https:", "http:", "mailto:", "tel:"]);
        if (!href) return null;

        const link = element("a", "contact-link", label || href);
        link.href = href;

        if (href.startsWith("http:") || href.startsWith("https:")) {
            link.target = "_blank";
            link.rel = "noopener noreferrer";
        }

        return link;
    }

    function section(title) {
        const wrapper = element("section", "contact-section");
        wrapper.appendChild(element("h2", "contact-section-title", title));
        return wrapper;
    }

    function cardGrid() {
        return element("div", "contact-grid");
    }

    function card(title, description) {
        const wrapper = element("article", "contact-card");
        if (title) wrapper.appendChild(element("h3", "contact-card-title", title));
        if (description) {
            wrapper.appendChild(element("p", "contact-muted", description));
        }
        return wrapper;
    }

    function renderOwner(owner) {
        if (!owner || typeof owner !== "object") return;

        const name = value(owner.name);
        const role = value(owner.role);
        const organization = value(owner.organization);
        const photo = safeUrl(owner.photo, ["https:", "http:"]);

        if (!name && !role && !organization && !photo) return;

        const wrapper = element("div", "contact-owner");

        if (photo) {
            const image = element("img", "contact-owner-photo");
            image.src = photo;
            image.alt = name ? name : "Contact profile";
            image.loading = "lazy";
            image.onerror = function () {
                image.remove();
            };
            wrapper.appendChild(image);
        }

        const details = element("div", "contact-owner-details");

        if (name) details.appendChild(element("h2", "", name));
        if (role) details.appendChild(element("p", "contact-muted", role));
        if (organization) {
            details.appendChild(element("p", "contact-muted", organization));
        }

        wrapper.appendChild(details);
        content.appendChild(wrapper);
    }

    function methodUrl(method) {
        const type = value(method.type).toLowerCase();
        const display = value(method.value);

        if (method.url) {
            return safeUrl(method.url, [
                "https:", "http:", "mailto:", "tel:", "sms:"
            ]);
        }

        if (!display) return "";

        if (type === "email") {
            return "mailto:" + display;
        }

        if (type === "phone") {
            return "tel:" + display.replace(/[^\d+]/g, "");
        }

        if (type === "whatsapp") {
            const number = display.replace(/\D/g, "");
            return number ? "https://wa.me/" + number : "";
        }

        if (type === "telegram") {
            const username = display.replace(/^@/, "");
            return username ? "https://t.me/" + username : "";
        }

        return "";
    }

    function renderMethods(methods) {
        if (!Array.isArray(methods)) return;

        const entries = methods.filter(item =>
            item && typeof item === "object" &&
            (value(item.value) || value(item.url))
        );

        if (!entries.length) return;

        const wrapper = section("Contact options");
        const grid = cardGrid();

        entries.forEach(method => {
            const label = value(method.label) || value(method.type) || "Contact";
            const display = value(method.value);
            const url = methodUrl(method);

            if (!url) return;

            const item = card(label);
            const link = externalLink(display || label, url);

            if (link) item.appendChild(link);
            grid.appendChild(item);
        });

        if (grid.children.length) {
            wrapper.appendChild(grid);
            content.appendChild(wrapper);
        }
    }

    function renderAddresses(addresses) {
        if (!Array.isArray(addresses)) return;

        const entries = addresses.filter(address => {
            if (!address || typeof address !== "object") return false;
            return [
                address.street, address.city, address.region,
                address.postalCode, address.country
            ].some(value);
        });

        if (!entries.length) return;

        const wrapper = section("Addresses");
        const grid = cardGrid();

        entries.forEach(address => {
            const item = card(value(address.label) || "Address");

            const lines = [
                value(address.street),
                [value(address.city), value(address.region)].filter(Boolean).join(", "),
                value(address.postalCode),
                value(address.country)
            ].filter(Boolean);

            lines.forEach(line => {
                item.appendChild(element("p", "contact-address-line", line));
            });

            let mapUrl = safeUrl(address.mapUrl, ["https:", "http:"]);

            if (!mapUrl && lines.length) {
                mapUrl = "https://www.google.com/maps/search/?api=1&query=" +
                    encodeURIComponent(lines.join(", "));
            }

            if (mapUrl) {
                const link = externalLink("View on map", mapUrl);
                if (link) {
                    link.classList.add("contact-map-link");
                    item.appendChild(link);
                }
            }

            grid.appendChild(item);
        });

        if (grid.children.length) {
            wrapper.appendChild(grid);
            content.appendChild(wrapper);
        }
    }

    function renderLinkList(title, entries) {
        if (!Array.isArray(entries)) return;

        const validEntries = entries.filter(item =>
            item && typeof item === "object" &&
            value(item.url)
        );

        if (!validEntries.length) return;

        const wrapper = section(title);
        const grid = cardGrid();

        validEntries.forEach(entry => {
            const label = value(entry.label) ||
                value(entry.platform) ||
                value(entry.username) ||
                "Visit link";

            const item = card(label, value(entry.description));
            const link = externalLink(
                value(entry.username) ? value(entry.username) : label,
                entry.url
            );

            if (link) {
                item.appendChild(link);
                grid.appendChild(item);
            }
        });

        if (grid.children.length) {
            wrapper.appendChild(grid);
            content.appendChild(wrapper);
        }
    }

    function renderHours(hours) {
        if (!hours || typeof hours !== "object") return;
        if (!Array.isArray(hours.items) || !hours.items.length) return;

        const wrapper = section("Contact hours");
        const timezone = value(hours.timezone);

        if (timezone) {
            wrapper.appendChild(element("p", "contact-muted", "Time zone: " + timezone));
        }

        const list = element("div", "contact-hours-list");

        hours.items.forEach(item => {
            if (!item || typeof item !== "object") return;

            const days = value(item.days);
            const times = value(item.hours);
            if (!days && !times) return;

            const row = element("div", "contact-hours-row");
            row.appendChild(element("span", "", days));
            row.appendChild(element("strong", "", times));
            list.appendChild(row);
        });

        if (list.children.length) wrapper.appendChild(list);

        if (value(hours.note)) {
            wrapper.appendChild(element("p", "contact-muted", value(hours.note)));
        }

        if (list.children.length || value(hours.note)) {
            content.appendChild(wrapper);
        }
    }

    function render(data) {
        if (!data || typeof data !== "object") {
            throw new Error("Invalid contact data");
        }

        const contact = data.contact;

        if (!contact || typeof contact !== "object") {
            content.replaceChildren(
                element("p", "contact-empty",
                    "No public contact information has been added yet.")
            );
            return;
        }

        if (contact.enabled === false) {
            content.replaceChildren(
                element("p", "contact-empty",
                    "Contact information is currently unavailable.")
            );
            return;
        }

        heading.textContent = value(contact.heading) || "Get in Touch";
        intro.textContent = value(contact.intro);
        intro.hidden = !value(contact.intro);

        content.replaceChildren();

        renderOwner(contact.owner);
        renderMethods(contact.methods);
        renderAddresses(contact.addresses);
        renderLinkList("Websites", contact.websites);
        renderLinkList("Social media", contact.socialLinks);
        renderHours(contact.hours);
        renderLinkList("Additional links", contact.additionalLinks);

        if (value(contact.publicNote)) {
            content.appendChild(
                element("div", "contact-public-note", value(contact.publicNote))
            );
        }

        if (!content.children.length) {
            content.appendChild(
                element("p", "contact-empty",
                    "No public contact information has been added yet.")
            );
        }
    }

    async function initialize() {
        try {
            const response = await fetch("data/contacts.json", {
                cache: "no-cache"
            });

            if (!response.ok) {
                throw new Error("Contact information could not be loaded");
            }

            const data = await response.json();
            render(data);
        } catch (error) {
            content.replaceChildren(
                element("p", "contact-empty",
                    "Contact information is not available right now.")
            );
        }
    }

    initialize();
})();
</script>
