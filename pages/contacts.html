<section class="contact-page" id="contact-page">

    <header class="contact-page-header">
        <p class="contact-eyebrow">CONTACT</p>
        <h1 id="contact-heading">Get in Touch</h1>
        <p id="contact-intro"></p>
    </header>

    <div id="contact-content" aria-live="polite">
        <p>Loading contact information...</p>
    </div>

</section>

<script>
(function () {
    const root = document.getElementById("contact-page");
    if (!root) return;

    const content = root.querySelector("#contact-content");
    const heading = root.querySelector("#contact-heading");
    const intro = root.querySelector("#contact-intro");

    function text(value) {
        return typeof value === "string" ? value.trim() : "";
    }

    function safeExternalUrl(value) {
        try {
            const url = new URL(text(value));
            return ["http:", "https:"].includes(url.protocol)
                ? url.href
                : "";
        } catch {
            return "";
        }
    }

    function safeContactUrl(value) {
        try {
            const url = new URL(text(value));
            return [
                "http:",
                "https:",
                "mailto:",
                "tel:",
                "sms:"
            ].includes(url.protocol) ? url.href : "";
        } catch {
            return "";
        }
    }

    function createElement(tag, className, value) {
        const element = document.createElement(tag);

        if (className) element.className = className;
        if (value !== undefined) element.textContent = value;

        return element;
    }

    function createSection(title, className) {
        const section = createElement(
            "section",
            "contact-section " + (className || "")
        );

        section.appendChild(
            createElement("h2", "contact-section-title", title)
        );

        content.appendChild(section);
        return section;
    }

    function createLink(url, label, className) {
        const link = document.createElement("a");

        link.href = url;
        link.textContent = label;
        link.className = className || "contact-link";

        if (url.startsWith("http:") || url.startsWith("https:")) {
            link.target = "_blank";
            link.rel = "noopener noreferrer";
        }

        return link;
    }

    function methodUrl(method) {
        const customUrl = safeContactUrl(method.url);
        if (customUrl) return customUrl;

        const value = text(method.value);
        const type = text(method.type).toLowerCase();

        if (!value) return "";

        if (type === "email" && value.includes("@")) {
            return "mailto:" + value;
        }

        if (type === "phone") {
            const number = value.replace(/[^\d+*#,;]/g, "");
            return number ? "tel:" + number : "";
        }

        if (type === "sms") {
            const number = value.replace(/[^\d+]/g, "");
            return number ? "sms:" + number : "";
        }

        if (type === "whatsapp") {
            const number = value.replace(/\D/g, "");
            return number
                ? "https://wa.me/" + number
                : "";
        }

        if (type === "telegram") {
            const username = value.replace(/^@/, "");
            return username
                ? "https://t.me/" + encodeURIComponent(username)
                : "";
        }

        return "";
    }

    function renderOwner(owner) {
        if (!owner || typeof owner !== "object") return;

        const name = text(owner.name);
        const role = text(owner.role);
        const organization = text(owner.organization);
        const photo = text(owner.photo);

        if (!name && !role && !organization && !photo) return;

        const card = createElement("div", "contact-owner");

        if (photo) {
            try {
                const imageUrl = new URL(photo, window.location.href);

                if (["http:", "https:"].includes(imageUrl.protocol)) {
                    const image = createElement(
                        "img",
                        "contact-owner-photo"
                    );

                    image.src = imageUrl.href;
                    image.alt = name || organization || "Contact owner";
                    image.loading = "lazy";

                    card.appendChild(image);
                }
            } catch {
                // Ignore invalid image paths.
            }
        }

        const details = createElement("div", "contact-owner-details");

        if (name) {
            details.appendChild(
                createElement("h2", "", name)
            );
        }

        if (role) {
            details.appendChild(
                createElement("p", "contact-owner-role", role)
            );
        }

        if (organization) {
            details.appendChild(
                createElement("p", "contact-owner-organization", organization)
            );
        }

        card.appendChild(details);
        content.appendChild(card);
    }

    function renderMethods(methods) {
        if (!Array.isArray(methods)) return;

        const validMethods = methods
            .filter(method => method && typeof method === "object")
            .map(method => ({
                method,
                url: methodUrl(method)
            }))
            .filter(item => item.url)
            .sort((a, b) =>
                Number(b.method.primary === true) -
                Number(a.method.primary === true)
            );

        if (!validMethods.length) return;

        const section = createSection(
            "Contact options",
            "contact-methods-section"
        );

        const grid = createElement("div", "contact-grid");

        validMethods.forEach(({ method, url }) => {
            const type = text(method.type).toLowerCase();
            const label = text(method.label) || type || "Contact";
            const value = text(method.value) || label;

            const card = createElement("article", "contact-card");
            const icon = createElement(
                "div",
                "contact-card-icon",
                {
                    email: "✉",
                    phone: "☎",
                    whatsapp: "W",
                    telegram: "T",
                    sms: "SMS"
                }[type] || "↗"
            );

            const details = createElement(
                "div",
                "contact-card-details"
            );

            details.appendChild(
                createElement("h3", "", label)
            );

            details.appendChild(
                createLink(url, value, "contact-link")
            );

            card.append(icon, details);
            grid.appendChild(card);
        });

        section.appendChild(grid);
    }

    function renderAddresses(addresses) {
        if (!Array.isArray(addresses)) return;

        const validAddresses = addresses.filter(address => {
            if (!address || typeof address !== "object") return false;

            return [
                address.street,
                address.city,
                address.region,
                address.postalCode,
                address.country
            ].some(value => text(value));
        });

        if (!validAddresses.length) return;

        const section = createSection("Locations", "contact-addresses");
        const grid = createElement("div", "contact-grid");

        validAddresses.forEach(address => {
            const card = createElement("article", "contact-card");

            card.appendChild(
                createElement(
                    "h3",
                    "contact-card-heading",
                    text(address.label) || "Address"
                )
            );

            const lines = [
                address.street,
                [address.city, address.region].filter(text).join(", "),
                address.postalCode,
                address.country
            ].map(text).filter(Boolean);

            const addressText = lines.join(", ");

            lines.forEach(line => {
                card.appendChild(
                    createElement("p", "contact-address-line", line)
                );
            });

            let mapUrl = safeExternalUrl(address.mapUrl);

            if (!mapUrl && addressText) {
                mapUrl =
                    "https://www.google.com/maps/search/?api=1&query=" +
                    encodeURIComponent(addressText);
            }

            if (mapUrl) {
                card.appendChild(
                    createLink(mapUrl, "View on map", "contact-link contact-map-link")
                );
            }

            grid.appendChild(card);
        });

        section.appendChild(grid);
    }

    function renderLinks(title, items, className) {
        if (!Array.isArray(items)) return;

        const validItems = items
            .filter(item => item && typeof item === "object")
            .map(item => ({
                item,
                url: safeExternalUrl(item.url)
            }))
            .filter(entry => entry.url);

        if (!validItems.length) return;

        const section = createSection(title, className);
        const grid = createElement("div", "contact-grid");

        validItems.forEach(({ item, url }) => {
            const card = createElement("article", "contact-card");

            const label =
                text(item.label) ||
                text(item.platform) ||
                "Website";

            card.appendChild(
                createElement("h3", "contact-card-heading", label)
            );

            if (text(item.username)) {
                card.appendChild(
                    createElement(
                        "p",
                        "contact-muted",
                        text(item.username)
                    )
                );
            }

            if (text(item.description)) {
                card.appendChild(
                    createElement(
                        "p",
                        "contact-muted",
                        text(item.description)
                    )
                );
            }

            card.appendChild(
                createLink(url, "Visit " + label, "contact-link")
            );

            grid.appendChild(card);
        });

        section.appendChild(grid);
    }

    function renderHours(hours) {
        if (!hours || typeof hours !== "object") return;

        const items = Array.isArray(hours.items)
            ? hours.items.filter(item =>
                item &&
                typeof item === "object" &&
                text(item.days) &&
                text(item.hours)
            )
            : [];

        const timezone = text(hours.timezone);
        const note = text(hours.note);

        if (!items.length && !timezone && !note) return;

        const section = createSection(
            "Availability",
            "contact-hours"
        );

        if (timezone) {
            section.appendChild(
                createElement(
                    "p",
                    "contact-muted",
                    "Timezone: " + timezone
                )
            );
        }

        if (items.length) {
            const list = createElement("div", "contact-hours-list");

            items.forEach(item => {
                const row = createElement("div", "contact-hours-row");

                row.append(
                    createElement("span", "", text(item.days)),
                    createElement("strong", "", text(item.hours))
                );

                list.appendChild(row);
            });

            section.appendChild(list);
        }

        if (note) {
            section.appendChild(
                createElement("p", "contact-muted", note)
            );
        }
    }

    function render(data) {
        if (data.enabled === false) {
            heading.textContent = "Contact information";
            content.appendChild(
                createElement(
                    "p",
                    "contact-empty",
                    "Contact information is currently unavailable."
                )
            );
            return;
        }

        heading.textContent = text(data.heading) || "Get in Touch";
        intro.textContent = text(data.intro);
        intro.hidden = !intro.textContent;

        renderOwner(data.owner);
        renderMethods(data.contactMethods);
        renderAddresses(data.addresses);

        renderLinks(
            "Websites",
            data.websites,
            "contact-websites"
        );

        renderLinks(
            "Social media",
            data.socialLinks,
            "contact-social"
        );

        renderHours(data.hours);

        renderLinks(
            "Other information",
            data.additionalLinks,
            "contact-additional"
        );

        const publicNote = text(data.publicNote);

        if (publicNote) {
            const note = createElement(
                "div",
                "contact-public-note",
                publicNote
            );

            content.appendChild(note);
        }

        if (!content.children.length) {
            content.appendChild(
                createElement(
                    "p",
                    "contact-empty",
                    "No public contact information has been added yet."
                )
            );
        }
    }

    async function initialize() {
        try {
            const response = await fetch("data/contact-details.json", {
                cache: "no-cache"
            });

            if (!response.ok) {
                throw new Error("Contact information file not found.");
            }

            const data = await response.json();

            if (!data || typeof data !== "object") {
                throw new Error("Invalid contact information.");
            }

            render(data);

        } catch (error) {
            console.error("Contacts page:", error);

            content.replaceChildren(
                createElement(
                    "p",
                    "contact-empty",
                    "Contact information could not be loaded. Please try again later."
                )
            );
        }
    }

    initialize();
})();
</script>
